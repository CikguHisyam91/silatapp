<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SilatApp — Laporan Pesilat</title>
<meta name="theme-color" content="#0E1014">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tema gelap minimalis — selaras dengan SilatApp utama */
:root{
  --bg:#0E1014;--card:#16191F;--card2:#1C2027;--card3:#242933;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --txt:#E8EAED;--muted:#8A919E;
  --gold:#E2B55A;--gold-rgb:226,181,90;--on-gold:#1A1406;
  --green:#4CC38A;--green-rgb:76,195,138;
  --blue:#6AA9F5;--blue-rgb:106,169,245;
  --orange:#E9A23B;--orange-rgb:233,162,59;
  --red:#F2706B;--red-rgb:242,112,107;
  --purple:#A391F5;--purple-rgb:163,145,245;
  --rad:14px;--rad-sm:10px;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:var(--font-b);background:var(--bg);color:var(--txt);font-size:15px;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;font-family:inherit;font-size:inherit;color:inherit;background:none}
input,select,textarea{font-family:var(--font-b)}
@media(max-width:480px){input,select,textarea{font-size:16px !important}}

/* ── Layout ── */
#app{max-width:560px;margin:0 auto;padding:0 0 80px}

/* ── Header ── */
#hdr{background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;height:56px;position:sticky;top:0;z-index:100}
#hdr h1{font-size:16px;font-weight:700;flex:1;color:var(--txt)}
.hdr-btn{width:38px;height:38px;border-radius:var(--rad-sm);border:1px solid var(--border);color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none}

/* ── Cards ── */
.kad{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:14px;margin:12px 14px 0}
.kad-tajuk{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kad-tajuk i{color:var(--muted);font-size:17px}

/* ── Gambar Pesilat ── */
#kotak-gambar{display:flex;flex-direction:column;align-items:center;gap:10px}
#pratonton-gambar{width:112px;height:112px;border-radius:var(--rad);border:1px solid var(--border2);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
#pratonton-gambar img{width:100%;height:100%;object-fit:cover}
.btn-kamera{display:flex;align-items:center;gap:6px;padding:9px 16px;background:var(--card3);border-radius:var(--rad-sm);color:var(--txt);font-weight:600;font-size:13px}

/* ── Carian & Pilihan Pesilat ── */
.pilih-wrap{position:relative}
.pilih-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.pilih-input{width:100%;padding:11px 12px 11px 40px;border:1px solid var(--border2);border-radius:var(--rad-sm);background:var(--card2);color:var(--txt);font-size:14px;outline:none}
.pilih-input:focus{border-color:rgba(var(--gold-rgb),.7)}
.senarai-carian{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card2);border:1px solid var(--border2);border-radius:var(--rad-sm);max-height:240px;overflow-y:auto;z-index:50;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.senarai-carian.buka{display:block}
.item-carian{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.item-carian:active,.item-carian:hover{background:var(--card3)}
.item-carian:last-child{border-bottom:none}
.item-carian .sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}

/* ── Profil Dipilih ── */
#profil-dipilih{display:none;background:var(--card2);border:1px solid var(--border);border-radius:var(--rad-sm);padding:12px;margin-top:10px}
#avatar-dipilih{background:var(--card3) !important}
.profil-nm{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:2px;word-break:break-word}
.profil-sub{font-size:12px;color:var(--muted)}
.bengkung-tag{display:inline-block;background:rgba(var(--gold-rgb),.12);color:var(--gold);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;margin-top:6px}

/* ── Item Penilaian ── */
.item-nilai{background:var(--card2);border:1px solid var(--border);border-radius:var(--rad-sm);padding:12px;margin-bottom:8px}
.item-nilai-nama{font-weight:600;font-size:14px;margin-bottom:10px;color:var(--txt)}
.status-btn-group{display:flex;gap:6px}
.status-btn{flex:1;padding:9px 4px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;background:var(--card3);color:var(--muted);border:1px solid transparent}
.status-btn.aktif-lemah{background:rgba(var(--red-rgb),.15);color:var(--red);border-color:rgba(var(--red-rgb),.4)}
.status-btn.aktif-sederhana{background:rgba(var(--orange-rgb),.15);color:var(--orange);border-color:rgba(var(--orange-rgb),.4)}
.status-btn.aktif-cemerlang{background:rgba(var(--green-rgb),.15);color:var(--green);border-color:rgba(var(--green-rgb),.4)}
.btn-padam-item{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;margin-left:8px;float:right}

/* ── Tambah Item ── */
.btn-tambah-item{display:flex;align-items:center;gap:8px;padding:10px 14px;background:transparent;border:1px dashed var(--border2);border-radius:var(--rad-sm);color:var(--muted);font-weight:600;cursor:pointer;width:100%;justify-content:center;margin-top:4px}

/* ── Skor ── */
#panel-skor{text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);margin:12px 14px 0}
.skor-num{font-size:30px;font-weight:700;color:var(--txt);letter-spacing:-.5px}
.skor-bar{height:6px;background:var(--card3);border-radius:99px;overflow:hidden;margin:10px 0}
.skor-fill{height:100%;background:var(--green);border-radius:99px;transition:.5s}
#skor-peratus{font-family:var(--font-b) !important;font-weight:700;color:var(--green) !important}

/* ── Form ── */
.form-kump{margin-bottom:12px}
.form-lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.form-inp{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--rad-sm);font-size:14px;color:var(--txt);background:var(--card2);outline:none}
.form-inp:focus{border-color:rgba(var(--gold-rgb),.7)}
select.form-inp option{background:var(--card2)}
textarea.form-inp{resize:vertical;min-height:80px}

/* ── Bakat Buttons ── */
.bakat-group{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bakat-btn{padding:11px 8px;border-radius:var(--rad-sm);font-size:13px;font-weight:600;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--muted)}
.bakat-btn.aktif{color:var(--txt);border-color:rgba(var(--gold-rgb),.6);background:rgba(var(--gold-rgb),.1)}

/* ── Butang Simpan ── */
.btn-simpan{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);margin:16px 14px;padding:14px;background:var(--gold);border-radius:var(--rad);color:var(--on-gold);font-size:15px;font-weight:700;cursor:pointer}
.btn-simpan:active{opacity:.85}
.btn-simpan:disabled{opacity:.5;cursor:not-allowed}

/* ── Toast ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card3);border:1px solid var(--border2);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:.25s;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
#toast.nampak{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(var(--green-rgb),.5)}
#toast.ralat{border-color:rgba(var(--red-rgb),.6)}

/* ── Loading ── */
.muat{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;color:var(--muted)}
.muat i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <a href="index.html" class="hdr-btn"><i class="ti ti-arrow-left"></i></a>
    <h1>Laporan Pesilat</h1>
  </header>

  <!-- Pilih Pesilat -->
  <div class="kad">
    <div class="kad-tajuk"><i class="ti ti-search"></i> Pilih Pesilat</div>
    <div class="pilih-wrap">
      <i class="ti ti-user"></i>
      <input class="pilih-input" id="inp-cari" type="text" placeholder="Taip nama atau No. KP..." autocomplete="off"
        oninput="cariPesilat(this.value)" onfocus="tunjukSenarai()">
      <div class="senarai-carian" id="senarai-carian"></div>
    </div>
    <div id="profil-dipilih">
      <div style="display:flex;gap:10px;align-items:center">
        <div id="avatar-dipilih" style="width:48px;height:48px;border-radius:10px;background:rgba(41,121,255,.3);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🥷</div>
        <div>
          <div class="profil-nm" id="nama-dipilih">—</div>
          <div class="profil-sub" id="kp-dipilih">—</div>
          <div class="bengkung-tag" id="bengkung-dipilih">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Gambar Pesilat -->
  <div class="kad">
    <div class="kad-tajuk"><i class="ti ti-camera"></i> Gambar Pesilat</div>
    <div id="kotak-gambar">
      <div id="pratonton-gambar"><span id="gambar-placeholder">📷</span></div>
      <button class="btn-kamera" onclick="ambilGambar()"><i class="ti ti-camera"></i> Ambil / Tukar Gambar</button>
      <input type="file" id="inp-kamera" accept="image/*" capture="environment" style="display:none" onchange="prosesGambar(this)">
      <div style="font-size:11px;color:var(--muted);text-align:center">Atau upload dari galeri telefon</div>
    </div>
  </div>

  <!-- Item Penilaian -->
  <div class="kad">
    <div class="kad-tajuk"><i class="ti ti-clipboard-check"></i> Penilaian Penguasaan</div>
    <div id="senarai-item">
      <div class="muat"><i class="ti ti-loader-2"></i> Pilih pesilat dulu...</div>
    </div>
    <button class="btn-tambah-item" onclick="tambahItemBaru()">
      <i class="ti ti-plus"></i> Tambah Item Penilaian
    </button>
  </div>

  <!-- Skor Auto -->
  <div id="panel-skor">
    <div class="skor-num"><span id="skor-val">0</span> / <span id="skor-max">0</span></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Jumlah Markah</div>
    <div class="skor-bar"><div class="skor-fill" id="skor-bar" style="width:0%"></div></div>
    <div style="font-family:'Lilita One';font-size:20px;color:var(--gold)" id="skor-peratus">0%</div>
  </div>

  <!-- Bakat & Catatan -->
  <div class="kad">
    <div class="kad-tajuk"><i class="ti ti-star"></i> Bakat sebagai Atlet</div>
    <div class="bakat-group" id="bakat-group">
      <div class="bakat-btn bakat-seni" onclick="pilihBakat('SILAT SENI',this)">🌸 Silat Seni</div>
      <div class="bakat-btn bakat-olah" onclick="pilihBakat('OLAHRAGA',this)">⚡ Olahraga</div>
      <div class="bakat-btn bakat-dua" onclick="pilihBakat('KEDUA-DUANYA',this)">🏆 Kedua-dua</div>
      <div class="bakat-btn bakat-belum aktif" onclick="pilihBakat('BELUM DIKENALPASTI',this)">❓ Belum Pasti</div>
    </div>
  </div>

  <div class="kad">
    <div class="kad-tajuk"><i class="ti ti-notes"></i> Catatan Guru</div>
    <textarea class="form-inp" id="catatan-guru" rows="3" placeholder="Pemerhatian, cadangan, nota perkembangan..."></textarea>
  </div>

  <button class="btn-simpan" id="btn-simpan" onclick="simpanLaporan()">
    <i class="ti ti-device-floppy"></i> Simpan Laporan
  </button>
</div>

<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby9urwBschyHvugUo0a2QxO3DWciTWul2bJuTBRrsmEPIaCCG3QH7Wp4jcpszY674ojSQ/exec';

// ── Sambungan API tanpa kuki Google ──
// Jika Chrome log masuk beberapa akaun Google, permintaan biasa (JSONP) membawa kuki akaun
// dan Google membalas "Sorry, unable to open the file". fetch() tanpa kuki = sama seperti
// mod Inkognito. Jika fetch tidak boleh digunakan, kembali ke cara lama (JSONP).
let _modFetch = null; // null = belum tahu, true = fetch berfungsi, false = guna JSONP
async function _fetchAPI(p) {
  const u = new URL(API_URL);
  Object.entries(p).forEach(([k, v]) => u.searchParams.set(k, String(v)));
  const r = await fetch(u.toString(), { credentials: 'omit' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function _apiPintar(p, jsonp, tulis) {
  if (_modFetch !== false) {
    let j;
    try { j = await _fetchAPI(p); _modFetch = true; }
    catch (e) {
      // Tulis: jangan hantar dua kali jika fetch sudah terbukti berfungsi
      if (tulis && _modFetch === true) throw new Error('Gagal sambung — cuba lagi');
      _modFetch = false;
      return jsonp();
    }
    if (!j.ok) throw new Error(j.error || 'Ralat API');
    return j.data;
  }
  return jsonp();
}
function api(tindakan, params = {}) {
  return _apiPintar(Object.assign({ tindakan: tindakan }, params), () => apiJsonp(tindakan, params), false);
}

let semuaAhli = [], pesilat = null, semuaItem = [], statusItem = {}, bakats = 'BELUM DIKENALPASTI', fotoBase64 = '';

// ── API JSONP ─────────────────────────────────────────────────
function apiJsonp(tindakan, params={}) {
  return new Promise((res, rej) => {
    const cb = 'cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const url = new URL(API_URL);
    url.searchParams.set('tindakan', tindakan);
    url.searchParams.set('callback', cb);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
    const t = setTimeout(() => { delete window[cb]; document.getElementById(cb)?.remove(); rej(new Error('Masa tamat')); }, 20000);
    window[cb] = (json) => { clearTimeout(t); delete window[cb]; document.getElementById(cb)?.remove(); json.ok ? res(json.data) : rej(new Error(json.error)); };
    const s = document.createElement('script');
    s.id = cb; s.src = url.toString();
    s.onerror = () => { clearTimeout(t); delete window[cb]; s.remove(); rej(new Error('Gagal sambung')); };
    document.head.appendChild(s);
  });
}
function apiPost(data) {
  // Guna fetch POST — elak had panjang URL (penting bila ada lampiran gambar)
  return fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // elak CORS preflight
    body: JSON.stringify(data)
  })
  .then(r => {
    if (!r.ok) throw new Error('Ralat server: ' + r.status);
    return r.json();
  })
  .then(json => {
    if (json.ok) return json.data;
    throw new Error(json.error || 'Ralat tidak diketahui');
  })
  .catch(err => {
    if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
      throw new Error('Gagal hantar — sambungan internet bermasalah atau gambar terlalu besar');
    }
    throw err;
  });
}

// ── Toast ─────────────────────────────────────────────────────
let toastTimer;
function tunjukToast(msg, jenis='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'nampak '+jenis;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className='', 3000);
}

// ── Load pesilat ──────────────────────────────────────────────
async function init() {
  try { semuaAhli = await api('senarai_ahli', {status:'AKTIF'}); } catch(e) {}
}
init();

// ── Carian ────────────────────────────────────────────────────
let timerCari;
function cariPesilat(q) {
  clearTimeout(timerCari);
  timerCari = setTimeout(() => {
    const senarai = document.getElementById('senarai-carian');
    if (!q) { senarai.classList.remove('buka'); return; }
    const hasil = semuaAhli.filter(a => String(a.nama||'').toLowerCase().includes(q.toLowerCase()) || String(a.no_kp||'').includes(q)).slice(0, 8);
    if (!hasil.length) { senarai.classList.remove('buka'); return; }
    senarai.innerHTML = hasil.map(a => `
      <div class="item-carian" onclick="pilihPesilat('${a.no_kp}')">
        ${a.nama}
        <div class="sub">${a.no_kp} · ${(a.bengkung||'').replace('BENGKUNG ','')}</div>
      </div>`).join('');
    senarai.classList.add('buka');
  }, 250);
}

function tunjukSenarai() {
  const q = document.getElementById('inp-cari').value;
  if (q) cariPesilat(q);
}

document.addEventListener('click', e => {
  if (!e.target.closest('#senarai-carian') && !e.target.closest('#inp-cari')) {
    document.getElementById('senarai-carian').classList.remove('buka');
  }
});


// ── Reset borang selepas simpan — kekal di halaman, sedia rekod baru ──
function resetBorangLaporan() {
  pesilat = null;
  semuaItem = [];
  statusItem = {};
  bakats = 'BELUM DIKENALPASTI';
  fotoBase64 = '';

  document.getElementById('inp-cari').value = '';
  document.getElementById('profil-dipilih').style.display = 'none';
  document.getElementById('senarai-item').innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">Pilih pesilat untuk muatkan item penilaian.</div>';
  document.getElementById('catatan-guru').value = '';

  // Reset gambar
  const kotak = document.getElementById('pratonton-gambar');
  if (kotak) kotak.innerHTML = '<span id="gambar-placeholder">📷</span>';

  // Reset skor
  kiraSkor();

  // Reset butang bakat (.bakat-btn)
  document.querySelectorAll('.bakat-btn').forEach(b => b.classList.remove('aktif'));

  // Reset butang simpan
  const btn = document.getElementById('btn-simpan');
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-device-floppy"></i> Simpan Laporan';

  // Scroll ke atas + fokus carian
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(() => document.getElementById('inp-cari')?.focus(), 300);
}

async function pilihPesilat(noKp) {
  pesilat = semuaAhli.find(a => a.no_kp === noKp);
  if (!pesilat) return;

  // Kosongkan gambar pesilat sebelum ini — elak gambar tersilap disimpan untuk pesilat lain
  fotoBase64 = '';
  const kotakGambar = document.getElementById('pratonton-gambar');
  if (kotakGambar) kotakGambar.innerHTML = '<span id="gambar-placeholder">📷</span>';
  document.getElementById('senarai-carian').classList.remove('buka');
  document.getElementById('inp-cari').value = pesilat.nama;

  // Tunjuk profil
  document.getElementById('profil-dipilih').style.display = 'block';
  document.getElementById('nama-dipilih').textContent = pesilat.nama;
  document.getElementById('kp-dipilih').textContent = pesilat.no_kp;
  document.getElementById('bengkung-dipilih').textContent = pesilat.bengkung || '—';

  // Load gambar sedia ada jika ada
  try {
    const profil = await api('profil_ahli', {no_kp: noKp});
    if (pesilat?.no_kp !== noKp) return; // pengguna sudah pilih pesilat lain
    if (!fotoBase64 && profil.FOTO_BASE64 && profil.FOTO_BASE64.length > 10) {
      paparGambar(profil.FOTO_BASE64);
    }
  } catch(e) {}

  // Load item penilaian
  await loadItemPenilaian(pesilat.bengkung);
}

async function loadItemPenilaian(bengkung) {
  const el = document.getElementById('senarai-item');
  el.innerHTML = '<div class="muat"><i class="ti ti-loader-2"></i> Memuatkan item...</div>';
  statusItem = {};
  try {
    semuaItem = await api('item_penilaian', {bengkung});
    if (!semuaItem.length) {
      el.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">Tiada item penilaian untuk bengkung ini.<br>Bos boleh tambah item di bawah.</div>';
    } else {
      renderItem();
    }
  } catch(e) {
    el.innerHTML = '<div style="color:var(--muted);text-align:center;padding:16px">Gagal muatkan item</div>';
  }
}

function renderItem() {
  const el = document.getElementById('senarai-item');
  el.innerHTML = semuaItem.map((item, i) => `
    <div class="item-nilai" id="item-${i}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div class="item-nilai-nama">${i+1}. ${item.NAMA_ITEM || item}</div>
        <button class="btn-padam-item" onclick="padamItem(${i})" title="Padam item ini">✕</button>
      </div>
      <div class="status-btn-group">
        <div class="status-btn ${statusItem[i]==='LEMAH'?'aktif-lemah':''}" onclick="tetapStatus(${i},'LEMAH',this)">😟 Lemah</div>
        <div class="status-btn ${statusItem[i]==='SEDERHANA'?'aktif-sederhana':''}" onclick="tetapStatus(${i},'SEDERHANA',this)">🙂 Sederhana</div>
        <div class="status-btn ${statusItem[i]==='CEMERLANG'?'aktif-cemerlang':''}" onclick="tetapStatus(${i},'CEMERLANG',this)">🌟 Cemerlang</div>
      </div>
    </div>`).join('');
  kiraSkor();
}

function tetapStatus(idx, status, el) {
  statusItem[idx] = status;
  const grup = el.parentElement;
  grup.querySelectorAll('.status-btn').forEach(b => b.className = 'status-btn');
  el.classList.add('aktif-' + status.toLowerCase());
  kiraSkor();
}

function padamItem(idx) {
  semuaItem.splice(idx, 1);
  delete statusItem[idx];
  // Rebuild statusItem indices
  const newStatus = {};
  Object.entries(statusItem).forEach(([k,v]) => { if(parseInt(k) < idx) newStatus[k]=v; else if(parseInt(k) > idx) newStatus[parseInt(k)-1]=v; });
  statusItem = newStatus;
  renderItem();
}

function tambahItemBaru() {
  const nama = prompt('Nama item penilaian baharu:');
  if (!nama || !nama.trim()) return;
  semuaItem.push({ NAMA_ITEM: nama.trim() });
  renderItem();
  // Scroll ke item baru
  setTimeout(() => {
    const items = document.querySelectorAll('.item-nilai');
    items[items.length-1]?.scrollIntoView({behavior:'smooth'});
  }, 100);
}

function kiraSkor() {
  const markah = { LEMAH:1, SEDERHANA:2, CEMERLANG:3 };
  let jumlah = 0, max = semuaItem.length * 3;
  Object.values(statusItem).forEach(s => { jumlah += markah[s] || 0; });
  const pct = max > 0 ? Math.round(jumlah/max*100) : 0;
  document.getElementById('skor-val').textContent = jumlah;
  document.getElementById('skor-max').textContent = max;
  document.getElementById('skor-bar').style.width = pct + '%';
  document.getElementById('skor-peratus').textContent = pct + '%';
}

// ── Gambar ────────────────────────────────────────────────────
function ambilGambar() { document.getElementById('inp-kamera').click(); }

function prosesGambar(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 480; let w=img.width, h=img.height;
      if(w>h){h=Math.round(h*(MAX/w));w=MAX;}else{w=Math.round(w*(MAX/h));h=MAX;}
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
      paparGambar(fotoBase64);
      tunjukToast('📷 Gambar siap (' + Math.round(fotoBase64.length/1024) + 'KB)', 'ok');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = ''; // benarkan pilih fail yang sama sekali lagi
}

function paparGambar(base64) {
  const kotak = document.getElementById('pratonton-gambar');
  kotak.innerHTML = `<img src="${base64}" alt="Gambar pesilat">`;
  fotoBase64 = base64;
}

// ── Bakat ─────────────────────────────────────────────────────
function pilihBakat(nilai, el) {
  bakats = nilai;
  document.querySelectorAll('.bakat-btn').forEach(b => b.classList.remove('aktif'));
  el.classList.add('aktif');
}

// ── Simpan ────────────────────────────────────────────────────
async function simpanLaporan() {
  if (!pesilat) { tunjukToast('Pilih pesilat dulu!', 'ralat'); return; }
  if (Object.keys(statusItem).length === 0) {
    if (!confirm('Tiada item penilaian yang ditandakan. Teruskan simpan?')) return;
  }

  const btn = document.getElementById('btn-simpan');
  btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Menyimpan...';

  const markah = { LEMAH:1, SEDERHANA:2, CEMERLANG:3 };
  let jumlah = 0, max = semuaItem.length * 3;
  const itemDetail = semuaItem.map((item, i) => ({
    nama: item.NAMA_ITEM || item,
    status: statusItem[i] || 'TIADA',
    markah: markah[statusItem[i]] || 0
  }));
  itemDetail.forEach(d => { jumlah += d.markah; });

  try {
    // Simpan laporan
    await apiPost({
      tindakan: 'simpan_laporan',
      no_kp: pesilat.no_kp,
      bengkung_semasa: pesilat.bengkung,
      bakat: bakats,
      jumlah_markah: jumlah,
      markah_max: max,
      peratus: max>0 ? Math.round(jumlah/max*100) : 0,
      catatan: document.getElementById('catatan-guru').value,
      item_detail: itemDetail,
      foto_base64: fotoBase64,
    });

    tunjukToast('✅ Laporan berjaya disimpan!', 'ok');
    setTimeout(resetBorangLaporan, 1200);
  } catch(e) {
    tunjukToast('Gagal: ' + e.message, 'ralat');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-device-floppy"></i> Simpan Laporan';
  }
}
</script>

</html>

<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Portal Jurulatih — Seri Mutiara</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jurulatih SM">

<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0020;--bg2:#1A0040;
  --amber:#FF8C00;--gold:#FFD700;--gold2:#FFA500;
  --jade:#1D9E75;--jade2:#00C896;
  --txt:#FFF8E7;--muted:#C4A882;
  --card:rgba(255,140,0,.07);--border:rgba(255,140,0,.2);
  --font-h:'Lilita One',cursive;--font-b:'Nunito',sans-serif;
  --rad:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font-b);background:radial-gradient(ellipse at top,var(--bg2),var(--bg));color:var(--txt);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,215,0,.08) 1px,transparent 1px);background-size:35px 35px;pointer-events:none;z-index:0}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px}
.login-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 40px rgba(255,215,0,.3),0 0 80px rgba(255,215,0,.15)}
.login-tajuk{font-family:var(--font-h);font-size:26px;color:var(--gold);text-align:center;text-shadow:0 0 20px rgba(255,215,0,.4)}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:-10px}
.login-kad{background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:var(--rad);padding:24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.login-input{width:100%;padding:13px 16px;border:2px solid rgba(255,215,0,.2);border-radius:12px;background:rgba(255,255,255,.06);color:var(--txt);font-size:15px;font-weight:700;font-family:var(--font-b);outline:none;transition:.2s}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,.15)}
.btn-masuk{padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--gold));color:#1A0000;font-family:var(--font-h);font-size:16px;border:none;cursor:pointer;transition:.1s;box-shadow:0 4px 0 #884400,0 8px 16px rgba(255,140,0,.3)}
.btn-masuk:active{transform:translateY(3px);box-shadow:0 1px 0 #884400}
.login-nota{font-size:11px;color:var(--muted);text-align:center}
#login-err{font-size:12px;color:#FF5177;text-align:center;display:none}

/* ── PORTAL ── */
#portal-screen{display:none;min-height:100vh;flex-direction:column}
#portal-header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border-bottom:2px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px}
#portal-header img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}
.hdr-info{flex:1;min-width:0}
.hdr-gelanggang{font-size:10px;color:var(--muted)}
.hdr-nama{font-family:var(--font-h);font-size:15px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-keluar{background:rgba(255,23,68,.15);border:1px solid rgba(255,23,68,.3);color:#FF5177;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}

/* ── TAB BAR ── */
#tab-bar{display:flex;background:rgba(0,0,0,.3);border-bottom:1px solid var(--border);padding:0 12px}
.tab-btn{padding:12px 18px;font-family:var(--font-h);font-size:13px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.tab-btn.aktif{color:var(--gold);border-bottom-color:var(--gold)}

/* ── CONTENT ── */
#portal-content{flex:1;padding:14px;max-width:600px;margin:0 auto;width:100%}

/* ── SILIBUS ── */
.kat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none}
.kat-scroll::-webkit-scrollbar{display:none}
.kat-pill{flex-shrink:0;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:rgba(255,255,255,.05);cursor:pointer;transition:.2s;white-space:nowrap}
.kat-pill.aktif{background:linear-gradient(135deg,var(--amber),var(--gold));color:#1A0000;border-color:var(--gold)}
.kat-pill:hover:not(.aktif){border-color:var(--gold);color:var(--gold)}

/* Video grid */
.video-grid{display:grid;gap:12px}
.video-kad{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:.2s}
.video-kad[onclick]{cursor:pointer}.video-kad[onclick]:hover{border-color:var(--gold);box-shadow:0 4px 20px rgba(255,215,0,.1)}
.video-thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0A2010,#1A4030);overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover;transition:.3s}
.video-thumb .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);opacity:0;transition:.2s}
.video-kad:hover .play-overlay{opacity:1}
.play-circle{width:54px;height:54px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;color:#1A0000;box-shadow:0 4px 16px rgba(255,215,0,.4)}
.video-thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(135deg,#0D2818,#1D4030)}
.video-body{padding:12px 14px}
.video-tajuk{font-size:14px;font-weight:800;color:var(--txt);margin-bottom:6px;line-height:1.3}
.video-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.video-kat{font-size:10px;font-weight:700;background:rgba(255,140,0,.15);color:var(--amber);border:1px solid rgba(255,140,0,.3);border-radius:6px;padding:2px 8px}
.btn-tonton{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;background:linear-gradient(135deg,var(--amber),var(--gold));color:#1A0000;font-size:11px;font-weight:800;border:none;cursor:pointer}

/* Inline player */
.inline-player{display:none;aspect-ratio:16/9;border-radius:0 0 12px 12px;overflow:hidden;border-top:2px solid var(--gold)}
.inline-player.buka{display:block}
.inline-player iframe{width:100%;height:100%;border:none}

/* Empty & Loading */
.muat{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:12px;color:var(--muted)}
.muat i{font-size:36px;color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kosong{display:flex;flex-direction:column;align-items:center;padding:60px 20px;gap:12px;color:var(--muted);text-align:center}
.kosong i{font-size:48px;color:var(--amber);opacity:.5}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,#2D1500,#3D2000);border:2px solid var(--gold);color:var(--gold);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:800;z-index:999;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.nampak{opacity:1;transform:translateX(-50%) translateY(0)}

/* Responsive */
@media(min-width:600px){
  .video-grid{grid-template-columns:1fr 1fr}
  #portal-content{padding:20px}
}
</style>
</head>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby9urwBschyHvugUo0a2QxO3DWciTWul2bJuTBRrsmEPIaCCG3QH7Wp4jcpszY674ojSQ/exec';
let dataSilibus = [];
let kategoriAktif = 'SEMUA';
let videoTerbuka = null;
let namaJurulatih = '';

// ── API ──────────────────────────────────────────────────────
function api(tindakan, params={}) {
  return new Promise((resolve, reject) => {
    const cb = 'jpc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = new URL(API_URL);
    url.searchParams.set('tindakan', tindakan);
    url.searchParams.set('callback', cb);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
    const timer = setTimeout(() => {
      delete window[cb]; document.getElementById(cb)?.remove();
      reject(new Error('Masa tamat'));
    }, 20000);
    window[cb] = (json) => {
      clearTimeout(timer); delete window[cb]; document.getElementById(cb)?.remove();
      if (json.ok) resolve(json.data);
      else reject(new Error(json.error || 'Ralat API'));
    };
    const s = document.createElement('script');
    s.id = cb; s.src = url.toString();
    s.onerror = () => { clearTimeout(timer); delete window[cb]; s.remove(); reject(new Error('Gagal sambung')); };
    document.head.appendChild(s);
  });
}

// ── Toast ────────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'nampak';
  clearTimeout(_tt); _tt = setTimeout(() => el.className='', 2500);
}

// ── Login / Logout ───────────────────────────────────────────
function masukPortal() {
  const nama = document.getElementById('inp-nama').value.trim();
  const err  = document.getElementById('login-err');
  if (!nama) {
    err.style.display = 'block';
    document.getElementById('inp-nama').style.borderColor = '#FF5177';
    return;
  }
  err.style.display = 'none';
  namaJurulatih = nama.toUpperCase();
  localStorage.setItem('jur_nama', namaJurulatih);
  document.getElementById('nama-jurulatih').textContent = namaJurulatih;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('portal-screen').style.display = 'flex';
  bukaTabs('silibus');
}

function keluarPortal() {
  if (!confirm('Keluar dari portal jurulatih?')) return;
  localStorage.removeItem('jur_nama');
  namaJurulatih = '';
  document.getElementById('inp-nama').value = '';
  document.getElementById('portal-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// Semak sesi tersimpan
const _sesi = localStorage.getItem('jur_nama');
if (_sesi) {
  namaJurulatih = _sesi;
  document.getElementById('nama-jurulatih').textContent = _sesi;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('portal-screen').style.display = 'flex';
  setTimeout(() => bukaTabs('silibus'), 100);
}

// ── Tab Navigation ───────────────────────────────────────────
function bukaTabs(tab) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('aktif'));
  const el = document.getElementById('tab-' + tab);
  if (el) el.classList.add('aktif');
  if (tab === 'silibus') renderSilibus();
}

// ── SILIBUS ──────────────────────────────────────────────────
async function renderSilibus() {
  const main = document.getElementById('portal-content');
  main.innerHTML = '<div class="muat"><i class="ti ti-loader-2"></i><span>Memuatkan silibus...</span></div>';
  try {
    dataSilibus = await api('silibus');
    if (!dataSilibus.length) {
      main.innerHTML = '<div class="kosong"><i class="ti ti-book-off"></i><p>Tiada video dalam silibus</p><p style="font-size:12px">Admin boleh tambah video dalam menu Silibus</p></div>';
      return;
    }
    // Kumpul kategori unik
    const kategoriSet = ['SEMUA'];
    dataSilibus.forEach(s => {
      const k = (s.KATEGORI || 'LAIN-LAIN').trim();
      if (!kategoriSet.includes(k)) kategoriSet.push(k);
    });
    paparSilibus(kategoriSet);
  } catch(e) {
    main.innerHTML = '<div class="kosong"><i class="ti ti-wifi-off"></i><p>Gagal muatkan silibus</p><p style="font-size:12px">' + e.message + '</p><button onclick="renderSilibus()" style="margin-top:10px;padding:8px 16px;background:var(--amber);color:#1A0000;border:none;border-radius:8px;font-weight:700;cursor:pointer">Cuba Semula</button></div>';
  }
}

function paparSilibus(kategoriSet) {
  const main = document.getElementById('portal-content');
  const kats  = kategoriSet || ['SEMUA'];
  const tapis = kategoriAktif === 'SEMUA' ? dataSilibus : dataSilibus.filter(s => (s.KATEGORI||'LAIN-LAIN') === kategoriAktif);

  let html = '';

  // Kategori pills
  html += '<div class="kat-scroll">';
  kats.forEach(k => {
    html += '<div class="kat-pill ' + (k === kategoriAktif ? 'aktif' : '') + '" onclick="tukarKat(\'' + k + '\')">' + k + '</div>';
  });
  html += '</div>';

  // Kiraan
  html += '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">' + tapis.length + ' video</div>';

  // Video grid
  if (!tapis.length) {
    html += '<div class="kosong"><i class="ti ti-video-off"></i><p>Tiada video dalam kategori ini</p></div>';
  } else {
    html += '<div class="video-grid">';
    tapis.forEach((s,i) => {
      const m    = (s.LINK||'').match(/\/d\/([^\/\?&]+)/);
      const fid  = m ? m[1] : '';
      const thumb = fid ? 'https://lh3.googleusercontent.com/d/' + fid + '=w400' : '';
      const tags  = (s.BENGKUNG_TAG||'').split(',').filter(Boolean);
      html += '<div class="video-kad" id="vkad-' + i + '" ' + (s.LINK ? 'onclick="mainVideo('+i+',\''+s.LINK+'\')"' : '') + '>';
      // Thumbnail
      html += '<div class="video-thumb">';
      if (thumb) {
        html += '<img src="' + thumb + '" alt="' + (s.TAJUK||'') + '" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">';
        html += '<div class="video-thumb-placeholder" style="display:none">🎬</div>';
      } else {
        html += '<div class="video-thumb-placeholder">🎬</div>';
      }
      if (s.LINK) html += '<div class="play-overlay"><div class="play-circle" id="pc-'+i+'">▶</div></div>';
      html += '</div>';
      // Body
      html += '<div class="video-body">';
      html += '<div class="video-tajuk">' + (s.TAJUK||'Video Tanpa Nama') + '</div>';
      if (tags.length || !s.LINK) {
        html += '<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px">';
        tags.forEach(t => {
          if (t.trim()) html += '<span style="font-size:9px;background:rgba(29,158,117,.15);color:var(--jade2);border:1px solid rgba(29,158,117,.3);border-radius:5px;padding:2px 6px">' + t.trim() + '</span>';
        });
        if (!s.LINK) html += '<span style="font-size:9px;color:var(--muted)">Tiada link</span>';
        html += '</div>';
      }
      html += '</div>';
      // Inline player slot
      html += '<div class="inline-player" id="vplay-' + i + '"><iframe id="vframe-' + i + '" src="" allowfullscreen></iframe></div>';
      html += '</div>';
    });
    html += '</div>';
  }

  main.innerHTML = html;
}

function tukarKat(kat) {
  kategoriAktif = kat;
  // Kumpul semula kategori
  const kategoriSet = ['SEMUA'];
  dataSilibus.forEach(s => {
    const k = (s.KATEGORI||'LAIN-LAIN').trim();
    if (!kategoriSet.includes(k)) kategoriSet.push(k);
  });
  paparSilibus(kategoriSet);
}

function mainVideo(idx, link) {
  const player = document.getElementById('vplay-' + idx);
  const frame  = document.getElementById('vframe-' + idx);
  if (!player || !frame) return;

  const sedangBuka = player.classList.contains('buka');

  // Tutup video lain
  if (videoTerbuka !== null && videoTerbuka !== idx) {
    const lama = document.getElementById('vplay-' + videoTerbuka);
    const lamaF = document.getElementById('vframe-' + videoTerbuka);
    if (lama) lama.classList.remove('buka');
    if (lamaF) lamaF.src = '';
  }

  if (sedangBuka) {
    player.classList.remove('buka');
    frame.src = '';
    videoTerbuka = null;
  } else {
    const m   = (link||'').match(/\/d\/([^\/\?&]+)/);
    const fid = m ? m[1] : '';
    const url = fid ? 'https://drive.google.com/file/d/' + fid + '/preview' : link;
    player.classList.add('buka');
    frame.src = url;
    videoTerbuka = idx;
    setTimeout(() => player.scrollIntoView({behavior:'smooth',block:'nearest'}), 200);
  }
}

// Touch swipe untuk tutup player
let touchY = 0;
document.addEventListener('touchstart', e => touchY = e.touches[0].clientY);
document.addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchY > 80 && videoTerbuka !== null) {
    const p = document.getElementById('vplay-' + videoTerbuka);
    const f = document.getElementById('vframe-' + videoTerbuka);
    if (p) p.classList.remove('buka');
    if (f) f.src = '';
    videoTerbuka = null;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Portal Ibu Bapa — Seri Mutiara</title>
<meta name="theme-color" content="#085041">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Poppins',sans-serif;background:#F0F4F8;color:#1A2332;font-size:15px}
button{cursor:pointer;border:none;font-family:inherit}input,select,textarea{font-family:'Poppins',sans-serif}
.portal-header{background:linear-gradient(135deg,#085041 0%,#0D7055 60%,#1D9E75 100%);color:#fff;padding:16px 20px 0}
.portal-header-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.portal-logo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#fff;padding:3px;flex-shrink:0}
.portal-subtitle{font-size:11px;opacity:.75;font-weight:500}
.portal-nama{font-size:18px;font-weight:700;line-height:1.2}
.portal-nav{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.15);margin:0 -20px}
.ptab{flex:1;padding:12px 4px;text-align:center;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);border-bottom:3px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.ptab.aktif{color:#fff;border-bottom-color:#9FE1CB}
#portal-main{padding:16px;max-width:700px;margin:0 auto}
#login-box{max-width:360px;margin:60px auto;background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 8px 40px rgba(8,80,65,.12);text-align:center}
.login-logo{width:80px;height:80px;border-radius:50%;object-fit:contain;background:#f0f9f6;padding:8px;margin:0 auto 16px;display:block}
.login-tajuk{font-size:20px;font-weight:700;color:#085041;margin-bottom:4px}
.login-sub{font-size:12px;color:#888;margin-bottom:24px}
.login-inp{width:100%;padding:12px 16px;border:2px solid #E2E8F0;border-radius:10px;font-size:16px;text-align:center;letter-spacing:2px;outline:none;transition:.2s;margin-bottom:12px}
.login-inp:focus{border-color:#1D9E75}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#085041,#1D9E75);color:#fff;border-radius:10px;font-size:15px;font-weight:700}
.login-error{color:#E53E3E;font-size:12px;margin-top:8px;min-height:18px}
.kad{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.kad-tajuk{font-size:12px;font-weight:700;color:#085041;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.profil-hero{background:linear-gradient(135deg,#085041,#1D9E75);border-radius:16px;padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.profil-hero::before{content:'';position:absolute;top:-20px;right:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.foto-wrapper{position:relative;flex-shrink:0;cursor:pointer}
.foto-bulat{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.4);display:block}
.foto-default{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
.foto-edit{position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:#FFD700;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.hero-info{flex:1;color:#fff}
.hero-nama{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:2px}
.hero-id{font-size:11px;opacity:.75;margin-bottom:8px}
.hero-bengkung{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-kad{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;overflow:hidden}
.stat-kad::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-kad.hijau::before{background:linear-gradient(90deg,#085041,#1D9E75)}
.stat-kad.biru::before{background:linear-gradient(90deg,#2979FF,#448AFF)}
.stat-kad.oren::before{background:linear-gradient(90deg,#FF6D00,#FF9100)}
.stat-kad.ungu::before{background:linear-gradient(90deg,#7B1FA2,#AB47BC)}
.stat-ikon{font-size:22px;margin-bottom:6px}
.stat-nilai{font-size:22px;font-weight:800;color:#1A2332;line-height:1}
.stat-unit{font-size:11px;color:#888}
.stat-lbl{font-size:11px;color:#666;margin-top:2px}
.stat-note{font-size:9px;color:#AAA;margin-top:4px}
.bmi-bar{height:6px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-top:6px}
.bmi-fill{height:100%;border-radius:99px;transition:.5s}
.yuran-bulan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ybk{border-radius:10px;padding:8px 4px;text-align:center;border:1.5px solid transparent}
.ybk.bayar{background:#E8F5E9;border-color:#A5D6A7}
.ybk.belum{background:#FFEBEE;border-color:#FFCDD2}
.ybk.tiada{background:#F5F5F5;border-color:#E0E0E0}
.ybk.akan{background:#FAFAFA;border-color:#EEEEEE;opacity:.5}
.ybk-bulan{font-size:10px;font-weight:700}
.ybk.bayar .ybk-bulan{color:#2E7D32}
.ybk.belum .ybk-bulan{color:#C62828}
.ybk.tiada .ybk-bulan,.ybk.akan .ybk-bulan{color:#9E9E9E}
.ybk-ikon{font-size:16px;margin:3px 0}
.ybk-rm{font-size:9px;font-weight:600}
.ybk.bayar .ybk-rm{color:#388E3C}
.ybk.belum .ybk-rm{color:#D32F2F}
.yuran-legend{display:flex;gap:12px;margin-top:8px;font-size:10px;color:#888}
.hadir-hero{display:flex;align-items:center;gap:20px;padding:20px;background:linear-gradient(135deg,#085041,#1D9E75);border-radius:16px;color:#fff;margin-bottom:12px}
.donut-wrap{position:relative;flex-shrink:0}
.donut-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-num{font-size:22px;font-weight:800;line-height:1}
.donut-lbl{font-size:9px;opacity:.8}
.hadir-stats{flex:1}
.hadir-stat-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.hadir-stat-row:last-child{border-bottom:none}
.hadir-stat-lbl{font-size:12px;opacity:.85}
.hadir-stat-val{font-size:12px;font-weight:700}
.bulan-kad{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bulan-bar{height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:6px 0}
.rekod-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0F4F8}
.rekod-item:last-child{border-bottom:none}
.rekod-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rekod-tarikh{flex:1;font-size:13px;font-weight:500}
.rekod-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.badge-hadir{background:#E8F5E9;color:#2E7D32}
.badge-tidak{background:#FFEBEE;color:#C62828}
.laporan-kad{background:#fff;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);overflow:hidden}
.laporan-header{padding:16px;background:linear-gradient(135deg,#085041,#1D9E75);color:#fff}
.laporan-header-row{display:flex;justify-content:space-between;align-items:flex-start}
.laporan-bengkung{font-size:15px;font-weight:700;margin-bottom:4px}
.laporan-tarikh{font-size:11px;opacity:.8}
.laporan-bakat{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;margin-top:8px}
.skor-bulat{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.skor-num{font-size:16px;font-weight:800;line-height:1}
.skor-sub{font-size:8px;opacity:.9}
.laporan-body{padding:16px}
.skor-bar-wrap{margin-bottom:12px}
.skor-bar-label{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:4px}
.skor-bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.skor-fill{height:100%;border-radius:99px;transition:1s}
.catatan-box{background:#F0F9F6;border-left:3px solid #1D9E75;border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:12px}
.catatan-lbl{font-size:10px;font-weight:700;color:#085041;text-transform:uppercase;margin-bottom:4px}
.catatan-teks{font-size:13px;color:#374151;line-height:1.5}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.item-kad{background:#F8FAFC;border-radius:8px;padding:8px 10px;border-left:3px solid #E2E8F0}
.item-kad.cemerlang{border-color:#1D9E75;background:#F0F9F6}
.item-kad.sederhana{border-color:#FF9100;background:#FFF8F0}
.item-kad.lemah{border-color:#E53935;background:#FFF5F5}
.item-nama{font-size:11px;font-weight:600;color:#374151;margin-bottom:3px}
.item-status{font-size:10px;font-weight:700}
.item-kad.cemerlang .item-status{color:#085041}
.item-kad.sederhana .item-status{color:#E65100}
.item-kad.lemah .item-status{color:#C62828}
.btn-pdf{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;background:linear-gradient(135deg,#085041,#1D9E75);color:#fff;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:10px}
.btn-lihat{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;background:#F0F9F6;color:#085041;border-radius:10px;font-size:12px;font-weight:600;border:1px solid #A5D6A7;margin-bottom:10px;cursor:pointer}
.komen-section{background:#F8FAFC;border-radius:10px;padding:12px;margin-top:4px}
.komen-lbl{font-size:11px;font-weight:700;color:#085041;margin-bottom:8px}
.komen-nota{font-size:11px;color:#888;background:#FFF9E6;border:1px solid #FFE082;border-radius:6px;padding:8px;margin-bottom:8px;line-height:1.5}
.komen-inp{width:100%;padding:10px 12px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:13px;outline:none;resize:vertical;min-height:70px}
.komen-inp:focus{border-color:#1D9E75}
.btn-komen{padding:8px 16px;background:#085041;color:#fff;border-radius:8px;font-size:12px;font-weight:700;margin-top:8px;float:right;cursor:pointer}
.kat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kat-btn{border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:.1s;border:2px solid transparent;border-bottom-width:4px;position:relative;overflow:hidden}
.kat-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:rgba(255,255,255,.15);border-radius:12px 12px 50% 50%}
.kat-btn:active{transform:translateY(3px);border-bottom-width:1px}
.kat-ikon{font-size:28px;position:relative;z-index:1}
.kat-nama{font-size:12px;font-weight:700;color:#fff;text-align:center;position:relative;z-index:1;line-height:1.3}
.kat-count{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.3);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px;z-index:1}
.video-panel{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.video-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.video-panel-tajuk{font-size:14px;font-weight:700;color:#085041}
.btn-tutup-video{background:#F0F4F8;border-radius:8px;padding:4px 10px;font-size:12px;color:#666;cursor:pointer}
.vid-item{display:flex;align-items:center;gap:10px;padding:10px;background:#F8FAFC;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1.5px solid #E2E8F0}
.vid-thumb{width:48px;height:36px;border-radius:6px;background:linear-gradient(135deg,#085041,#1D9E75);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:16px;flex-shrink:0;overflow:hidden}
.vid-thumb img{width:100%;height:100%;object-fit:cover}
.vid-info{flex:1;min-width:0}
.vid-nama{font-size:13px;font-weight:600;color:#1A2332;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid-kat{font-size:10px;color:#888;margin-top:2px}
.vid-embed{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;margin-top:8px;display:none}
.vid-embed iframe{width:100%;height:100%;border:none}
.btn-keluar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;color:#E53E3E;font-size:14px;font-weight:600;background:#FFF5F5;border-radius:12px;margin-top:4px}
.muat{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:#888;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
.toast-el{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#085041;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:.3s;white-space:nowrap;max-width:90vw}
.toast-el.nampak{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx4ODCCNsndgvcCGmNxW70RACJxCzGg1704SvFOEiz_-Dj597ZoAUinpJ-0L7bLbfkgsg/exec';
let dataAnak=null,tabAktif='profil',dataKehadiran=[],dataYuran=[],kumpulanSilibus={};

const BULAN_S=['JAN','FEB','MAC','APR','MEI','JUN','JUL','OGS','SEP','OKT','NOV','DIS'];
const BULAN_P=['JANUARI','FEBRUARI','MAC','APRIL','MEI','JUN','JULAI','OGOS','SEPTEMBER','OKTOBER','NOVEMBER','DISEMBER'];

function api(tindakan,params={}) {
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const url=new URL(API_URL);
    url.searchParams.set('tindakan',tindakan);
    url.searchParams.set('callback',cb);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));
    const t=setTimeout(()=>{delete window[cb];document.getElementById(cb)?.remove();rej(new Error('Masa tamat'));},20000);
    window[cb]=(j)=>{clearTimeout(t);delete window[cb];document.getElementById(cb)?.remove();j.ok?res(j.data):rej(new Error(j.error));};
    const s=document.createElement('script');s.id=cb;s.src=url.toString();
    s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();rej(new Error('Gagal sambung'));};
    document.head.appendChild(s);
  });
}
function apiPost(data) {
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const url=new URL(API_URL);
    url.searchParams.set('callback',cb);
    url.searchParams.set('_data',JSON.stringify(data));
    const t=setTimeout(()=>{delete window[cb];document.getElementById(cb)?.remove();rej(new Error('Masa tamat'));},20000);
    window[cb]=(j)=>{clearTimeout(t);delete window[cb];document.getElementById(cb)?.remove();j.ok?res(j.data):rej(new Error(j.error));};
    const s=document.createElement('script');s.id=cb;s.src=url.toString();
    s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();rej(new Error('Gagal'));};
    document.head.appendChild(s);
  });
}

let toastT;
function toast(msg,ok=true) {
  const el=document.getElementById('toast-msg');
  el.textContent=msg;el.style.background=ok?'#085041':'#C62828';
  el.classList.add('nampak');clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('nampak'),3000);
}

// Semak PDPA consent dari localStorage masa page load
(function() {
  if(localStorage.getItem('pdpa_setuju')==='1') {
    const wrap = document.getElementById('pdpa-wrap');
    const cb   = document.getElementById('pdpa-agree');
    if(wrap) wrap.style.display = 'none';
    if(cb)   cb.checked = true;
  }
})();

async function login() {
  const kp=document.getElementById('inp-kp').value.trim();
  const err=document.getElementById('login-error');
  if(!document.getElementById('pdpa-agree')?.checked){err.textContent='Sila bersetuju dengan Notis PDPA terlebih dahulu';return;}
  if(kp.length!==12){err.textContent='No. KP mesti 12 digit';return;}
  err.textContent='Memeriksa...';
  try {
    const ahli=await api('profil_ahli',{no_kp:kp});
    if(!ahli||!ahli.NAMA_PENUH) throw new Error('Ahli tidak dijumpai');

function kiraUsia(tarikh,noKp) {
  let tL=null;
  if(tarikh&&tarikh.length>=6) tL=new Date(tarikh);
  else if(noKp&&noKp.length>=6){
    const yy=parseInt(noKp.substring(0,2)),mm=noKp.substring(2,4),dd=noKp.substring(4,6);
    tL=new Date((yy<=30?2000+yy:1900+yy)+'-'+mm+'-'+dd);
  }
  if(!tL||isNaN(tL.getTime())) return null;
  const now=new Date();let u=now.getFullYear()-tL.getFullYear();
  if(now.getMonth()<tL.getMonth()||(now.getMonth()===tL.getMonth()&&now.getDate()<tL.getDate())) u--;
  return u;
}
function katUsia(u) {
  if(u<=6) return 'PRA TUNAS (5-6)';if(u<=8) return 'TUNAS (7-8)';
  if(u<=10) return 'PRA DINI (9-10)';if(u<=12) return 'DINI (11-12)';
  if(u<=14) return 'PRA REMAJA (13-14)';if(u<=16) return 'REMAJA (15-16)';
  if(u<=20) return 'SUKMA (16-20)';if(u<=35) return 'TERBUKA (21-35)';
  if(u<=45) return 'MASTER 2 (35-45)';return 'MASTER 1 (45+)';
}
function warnaBMI(b){if(!b)return'#9E9E9E';if(b<18.5)return'#2979FF';if(b<23)return'#085041';if(b<27.5)return'#FF6D00';return'#C62828';}
function labelBMI(b){if(!b)return'—';if(b<18.5)return'Kurus';if(b<23)return'Normal';if(b<27.5)return'Lebih Berat';return'Obes';}
function pctBMI(b){if(!b)return 0;const mn=10,mx=40;return Math.min(100,Math.max(0,Math.round((b-mn)/(mx-mn)*100)));}
function wPct(p){return p>=90?'#085041':p>=75?'#1D9E75':p>=60?'#FF9100':'#C62828';}
function fmtT(val){
  if(!val||val==='undefined'||val===''||val===null) return '—';
  // Handle format panjang dari Google Sheets: "Fri May 15 2026 00:00:00 GMT+0800..."
  let d = new Date(val);
  if(!isNaN(d.getTime())){
    // Elak timezone shift — ambil tarikh UTC
    const offset = d.getTimezoneOffset();
    d = new Date(d.getTime() - offset * 60000);
    const dd=d.getUTCDate().toString().padStart(2,'0');
    const mm=String(d.getUTCMonth()+1).padStart(2,'0');
    const yy=d.getUTCFullYear();
    return dd+'/'+mm+'/'+yy;
  }
  // Format YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(String(val))){
    const p=String(val).substring(0,10).split('-');
    return p[2]+'/'+p[1]+'/'+p[0];
  }
  // Dah dalam format DD/MM/YYYY
  if(/^\d{2}\/\d{2}\/\d{4}/.test(String(val))) return String(val).substring(0,10);
  return String(val).substring(0,10);
}

function prosesGambar(input) {
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=async()=>{
      const canvas=document.createElement('canvas');
      const MAX=200;let w=img.width,h=img.height;
      if(w>h){h=Math.round(h*(MAX/w));w=MAX;}else{w=Math.round(w*(MAX/h));h=MAX;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const b64=canvas.toDataURL('image/jpeg',.72);
      try {
        await apiPost({tindakan:'simpan_foto_pesilat',no_kp:dataAnak.NO_KP,foto_base64:b64});
        dataAnak.FOTO_BASE64=b64;toast('✅ Gambar disimpan!');renderProfil();
      }catch(e){dataAnak.FOTO_BASE64=b64;renderProfil();toast('Gambar dikemaskini',true);}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

async function muatYuranParent() {
  const el=document.getElementById('grid-yuran-parent');
  if(!el||!dataAnak)return;
  const tahun=new Date().getFullYear(),bSkrg=new Date().getMonth();
  try {
    // Ambil rekod yuran anak DAN rekod sistem (SEDEKAH/DIKECUALIKAN) serentak
    const [rekod, rekodSistem] = await Promise.all([
      api('yuran',{no_kp:dataAnak.NO_KP}),
      api('yuran',{no_kp:'SEDEKAH'})
    ]);
    dataYuran=rekod;
    let html='<div class="yuran-bulan-grid">';
    BULAN_S.forEach((b,i)=>{
      const bP=BULAN_P[i];
      if(i>bSkrg){html+=`<div class="ybk akan"><div class="ybk-bulan">${b}</div><div class="ybk-ikon">·</div></div>`;return;}
      const bayar=rekod.find(r=>(r.BULAN||'').toUpperCase()===bP&&String(r.TAHUN)===String(tahun)&&r.STATUS_PENGESAHAN==='SELESAI');
      // Semak rekod dikecualikan dari rekod sistem (NO_KP=SEDEKAH)
      const dikecuali=(rekodSistem||[]).find(r=>(r.BULAN||'').toUpperCase()===bP&&String(r.TAHUN)===String(tahun)&&(r.JENIS_YURAN==='DIKECUALIKAN'||r.JENIS_YURAN==='TIADA_BAYARAN'||r.JENIS_YURAN==='SEDEKAH'));
      if(dikecuali) html+=`<div class="ybk tiada"><div class="ybk-bulan">${b}</div><div class="ybk-ikon">${dikecuali.JENIS_YURAN==='DIKECUALIKAN'?'🚫':'📵'}</div><div class="ybk-rm">${dikecuali.JENIS_YURAN==='DIKECUALIKAN'?'Kecuali':'Tiada'}</div></div>`;
      else if(bayar) html+=`<div class="ybk bayar"><div class="ybk-bulan">${b}</div><div class="ybk-ikon">✅</div><div class="ybk-rm">RM${parseFloat(bayar.JUMLAH_BAYARAN||0).toFixed(0)}</div></div>`;
      else html+=`<div class="ybk belum"><div class="ybk-bulan">${b}</div><div class="ybk-ikon">❌</div><div class="ybk-rm">Belum</div></div>`;
    });
    html+='</div><div class="yuran-legend"><span>✅ Bayar</span><span>❌ Belum</span><span>📵 Tiada kutipan</span><span>🚫 Dikecualikan</span></div>';
    el.innerHTML=html;
  }catch(e){if(el)el.innerHTML='<div style="font-size:12px;color:#aaa;padding:8px">Gagal muatkan status yuran</div>';}
}

      ${!senarai||!senarai.length?`<div class="kad" style="text-align:center;padding:30px;color:#aaa"><div style="font-size:32px;margin-bottom:8px">📋</div><div style="font-size:14px;font-weight:600">Tiada laporan lagi</div><div style="font-size:12px;margin-top:4px">Laporan akan diisi oleh jurulatih selepas penilaian</div></div>`
      :[...senarai].reverse().map((l,idx)=>{
        const pct=parseFloat(l.PERATUS)||0;
        const wS=pct>=80?'#085041':pct>=60?'#FF9100':'#C62828';
        return `<div class="laporan-kad">
          <div class="laporan-header">
            <div class="laporan-header-row">
              <div>
                <div class="laporan-bengkung">${l.BENGKUNG_SEMASA||'—'}</div>
                <div class="laporan-tarikh">📅 ${fmtT(l.TARIKH_LAPORAN)}</div>
                ${l.BAKAT?`<div class="laporan-bakat">${labelBakat(l.BAKAT)}</div>`:''}
              </div>
              <div class="skor-bulat"><div class="skor-num">${Math.round(pct)}%</div><div class="skor-sub">${l.JUMLAH_MARKAH}/${l.MARKAH_MAX}</div></div>
            </div>
          </div>
          <div class="laporan-body">
            <div class="skor-bar-wrap">
              <div class="skor-bar-label"><span>Tahap Penguasaan</span><span style="font-weight:700;color:${wS}">${Math.round(pct)}%</span></div>
              <div class="skor-bar"><div class="skor-fill" style="width:${pct}%;background:${wS}"></div></div>
            </div>
            ${l.CATATAN_GURU?`<div class="catatan-box"><div class="catatan-lbl">Catatan Guru</div><div class="catatan-teks">${l.CATATAN_GURU}</div></div>`:''}
            <button class="btn-lihat" onclick="muatDetail('${l.ID_LAPORAN}','det${idx}')"><i class="ti ti-list-check"></i> Lihat Butiran Penilaian ▼</button>
            <div id="det${idx}"></div>
            <button class="btn-pdf" onclick="muatPDF('${l.ID_LAPORAN}')"><i class="ti ti-file-download"></i> 📄 Muat Turun Laporan PDF</button>
            <div class="komen-section">
              <div class="komen-lbl">💬 Maklum Balas Ibu Bapa</div>
              <div class="komen-nota">ℹ️ Maklum balas anda akan disampaikan kepada pihak gelanggang. Kami akan cuba menambah baik mengikut kemampuan yang ada.</div>
              <textarea class="komen-inp" id="km${l.ID_LAPORAN}" placeholder="Tulis maklum balas, soalan, atau cadangan..."></textarea>
              <div style="overflow:hidden"><button class="btn-komen" onclick="hantarKomen('${l.ID_LAPORAN}')">Hantar ✉️</button></div>
            </div>
          </div>
        </div>`;
      }).join('')}
      <button class="btn-keluar" onclick="keluar()"><i class="ti ti-logout"></i> Log Keluar</button>
    `;
  }catch(e){main.innerHTML=`<div style="text-align:center;padding:30px;color:#aaa">Gagal: ${e.message}</div>`;}
}

async function muatDetail(id,divId) {
  const el=document.getElementById(divId);if(!el)return;
  if(el.innerHTML.trim()){el.innerHTML='';return;}
  el.innerHTML='<div class="muat" style="padding:10px"><i class="ti ti-loader-2 spin"></i></div>';
  try {
    const data=await api('laporan_pesilat',{id_laporan:id});
    const items=data.detail||[];
    if(!items.length){el.innerHTML='<div style="font-size:12px;color:#aaa;padding:8px">Tiada butiran</div>';return;}
    el.innerHTML='<div class="item-grid">'+items.map(i=>{
      const s=(i.STATUS||i.status||'').toLowerCase();
      return `<div class="item-kad ${s}"><div class="item-nama">${i.NAMA_ITEM||i.nama_item||'—'}</div><div class="item-status">${s==='cemerlang'?'🌟 Cemerlang':s==='sederhana'?'🙂 Sederhana':s==='lemah'?'😟 Lemah':'—'}</div></div>`;
    }).join('')+'</div>';
  }catch(e){el.innerHTML='<div style="font-size:12px;color:#aaa">Gagal</div>';}
}

async function muatPDF(idLaporan) {
  toast('⏳ Menjana PDF...');
  try {
    const data=await api('laporan_pesilat',{id_laporan:idLaporan});
    await janaPDF(data,data.detail||[]);
  }catch(e){toast('Gagal jana PDF: '+e.message,false);}
}

function hantarKomen(id) {
  const teks=document.getElementById('km'+id)?.value?.trim();
  if(!teks){toast('Sila tulis maklum balas dahulu',false);return;}
  const sedia=JSON.parse(localStorage.getItem('komen_laporan')||'[]');
  sedia.push({id,teks,tarikh:new Date().toLocaleDateString('ms-MY'),nama:dataAnak.NAMA_PENUH});
  localStorage.setItem('komen_laporan',JSON.stringify(sedia));
  toast('✅ Maklum balas dihantar. Terima kasih!');
  document.getElementById('km'+id).value='';
}

async function renderSilibus() {
  const main=document.getElementById('portal-main');
  main.innerHTML='<div class="muat"><i class="ti ti-loader-2 spin"></i> Memuatkan...</div>';
  try {
    const data=await api('silibus');
    kumpulanSilibus={};
    data.forEach(s=>{const k=s.KATEGORI||'LAIN-LAIN';if(!kumpulanSilibus[k])kumpulanSilibus[k]=[];kumpulanSilibus[k].push(s);});
    const bengkung=(dataAnak.BENGKUNG_SEMASA||'').toUpperCase();
    function katRelevan(b) {
      if(b.includes('HITAM')) return ['WIRID 700','BENGKUNG HITAM','SENAMAN KEKUDA','TARI TERATAI','IBU GAYONG'];
      if(b.includes('PUTIH')) return ['WIRID 700','BENGKUNG HITAM','BENGKUNG PUTIH','TARI TERATAI','PECAHAN IBU GAYONG','IBU GAYONG'];
      if(b.includes('BIRU'))  return ['BENGKUNG PUTIH','BENGKUNG BIRU','TARI TERATAI','PECAHAN IBU GAYONG','IBU GAYONG'];
      if(b.includes('HIJAU')) return ['BENGKUNG BIRU','BENGKUNG HIJAU','TARI TERATAI','PECAHAN IBU GAYONG'];
      return Object.keys(kumpulanSilibus);
    }
    const kat=katRelevan(bengkung);
    const wKat={'WIRID 700':'linear-gradient(135deg,#5C35B0,#7B52D4)','BENGKUNG HITAM':'linear-gradient(135deg,#263238,#37474F)','BENGKUNG PUTIH':'linear-gradient(135deg,#7986CB,#5C6BC0)','BENGKUNG BIRU':'linear-gradient(135deg,#1565C0,#1976D2)','BENGKUNG HIJAU':'linear-gradient(135deg,#1B5E20,#2E7D32)','BENGKUNG KUNING':'linear-gradient(135deg,#F57F17,#F9A825)','BENGKUNG MERAH':'linear-gradient(135deg,#B71C1C,#C62828)','TARI TERATAI':'linear-gradient(135deg,#00695C,#00897B)','PECAHAN IBU GAYONG':'linear-gradient(135deg,#4527A0,#5E35B1)','SENAMAN KEKUDA':'linear-gradient(135deg,#37474F,#546E7A)','IBU GAYONG':'linear-gradient(135deg,#BF360C,#D84315)','LAIN-LAIN':'linear-gradient(135deg,#546E7A,#607D8B)'};
    const ikonKat={'WIRID 700':'📖','BENGKUNG HITAM':'🥷','BENGKUNG PUTIH':'🤍','BENGKUNG BIRU':'💙','BENGKUNG HIJAU':'💚','BENGKUNG KUNING':'💛','BENGKUNG MERAH':'❤️','TARI TERATAI':'🌸','PECAHAN IBU GAYONG':'⚔️','SENAMAN KEKUDA':'🏋️','IBU GAYONG':'🌟','LAIN-LAIN':'📁'};
    const katAktif=Object.keys(kumpulanSilibus).filter(k=>kat.some(r=>k.includes(r)));
    const katLain=Object.keys(kumpulanSilibus).filter(k=>!kat.some(r=>k.includes(r)));

    function grid(sKat,tajuk,warna) {
      if(!sKat.length) return '';
      return `<div style="font-size:11px;font-weight:700;color:${warna};text-transform:uppercase;margin:12px 0 8px;letter-spacing:.5px">${tajuk}</div>
      <div class="kat-grid">${sKat.map(k=>{
        const count=(kumpulanSilibus[k]||[]).filter(s=>s.LINK).length;
        const bg=wKat[k]||wKat['LAIN-LAIN'];
        const ikon=ikonKat[k]||'📁';
        const rel=kat.some(r=>k.includes(r));
        return `<div class="kat-btn" style="background:${bg};box-shadow:0 5px 0 rgba(0,0,0,.25);border-color:rgba(255,255,255,.3)" onclick="bukaSilibus('${k}')">
          ${rel?'<span class="kat-count">✓ Semasa</span>':''}
          <div class="kat-ikon">${ikon}</div>
          <div class="kat-nama">${k}</div>
          <div style="font-size:9px;color:rgba(255,255,255,.7);position:relative;z-index:1">${count} video</div>
        </div>`;
      }).join('')}</div>`;
    }

    main.innerHTML=`
      <div class="kad" style="background:linear-gradient(135deg,#085041,#1D9E75);color:#fff;margin-bottom:12px">
        <div style="font-size:12px;opacity:.8;margin-bottom:4px">Tahap Bengkung Semasa</div>
        <div style="font-size:16px;font-weight:700">🥋 ${bengkung||'—'}</div>
        <div style="font-size:11px;opacity:.7;margin-top:4px">Pilih kategori untuk tonton video pelajaran</div>
      </div>
      ${grid(katAktif,'📚 Pelajaran Tahap Semasa','#085041')}
      ${grid(katLain,'📁 Semua Bahan Rujukan','#888')}
      <div id="panel-video" style="display:none"></div>
      <button class="btn-keluar" onclick="keluar()"><i class="ti ti-logout"></i> Log Keluar</button>
    `;
  }catch(e){main.innerHTML=`<div style="text-align:center;padding:30px;color:#aaa">Gagal: ${e.message}</div>`;}
}

function bukaSilibus(k) {
  const panel=document.getElementById('panel-video');if(!panel)return;
  const items=(kumpulanSilibus[k]||[]).filter(s=>s.LINK);
  if(!items.length){toast('Tiada video untuk kategori ini',false);return;}
  panel.style.display='block';
  panel.innerHTML=`<div class="video-panel">
    <div class="video-panel-header">
      <div class="video-panel-tajuk">${k}</div>
      <div class="btn-tutup-video" onclick="document.getElementById('panel-video').style.display='none'">✕ Tutup</div>
    </div>
    ${items.map(s=>{
      const m=(s.LINK||'').match(/\/d\/([^\/\?&]+)/);
      const fid=m?m[1]:'';
      const thumb=fid?'https://lh3.googleusercontent.com/d/'+fid+'=w100':'';
      return `<div class="vid-item" onclick="mainVid('${s.ID}','${s.LINK}')">
        <div class="vid-thumb">${thumb?`<img src="${thumb}" onerror="this.style.display='none'">`:''} ▶</div>
        <div class="vid-info"><div class="vid-nama">${s.TAJUK||'—'}</div><div class="vid-kat">${s.KATEGORI||'—'}</div></div>
      </div>
      <div class="vid-embed" id="vembed-${s.ID}"><iframe id="vframe-${s.ID}" src="" allowfullscreen allow="autoplay"></iframe></div>`;
    }).join('')}
  </div>`;
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

function mainVid(id,link) {
  const embed=document.getElementById('vembed-'+id),frame=document.getElementById('vframe-'+id);
  if(!embed||!frame)return;
  const buka=embed.style.display!=='block';
  document.querySelectorAll('.vid-embed').forEach(e=>{e.style.display='none';});
  document.querySelectorAll('.vid-embed iframe').forEach(f=>{f.src='';});
  if(buka){
    const m=(link||'').match(/\/d\/([^\/\?&]+)/);
    const fid=m?m[1]:'';
    frame.src=fid?'https://drive.google.com/file/d/'+fid+'/preview':link;
    embed.style.display='block';
    embed.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}



// ── Isu 8: Notifikasi Tunggakan ──────────────────────────────
async function semakTunggakanParent() {
  if(!dataAnak) return;
  try {
    const rekod = await api('yuran',{no_kp:dataAnak.NO_KP});
    const [rekodSistem] = await Promise.all([api('yuran',{no_kp:'SEDEKAH'})]);
    const tahun = new Date().getFullYear();
    const bulanSkrg = new Date().getMonth();
    const belumBayar = [];
    BULAN_P.forEach((bP,i)=>{
      if(i>bulanSkrg) return;
      const bayar = rekod.find(r=>(r.BULAN||'').toUpperCase()===bP&&String(r.TAHUN)===String(tahun)&&r.STATUS_PENGESAHAN==='SELESAI');
      const dikecuali = (rekodSistem||[]).find(r=>(r.BULAN||'').toUpperCase()===bP&&String(r.TAHUN)===String(tahun));
      if(!bayar&&!dikecuali) belumBayar.push(BULAN_S[i]);
    });
    if(belumBayar.length===0) return;
    // Papar notifikasi
    const notif = document.createElement('div');
    notif.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:#C62828;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3)';
    notif.innerHTML='<span>⚠️ Yuran belum bayar: <strong>'+belumBayar.join(', ')+'</strong></span>'+
      '<button onclick="this.parentElement.remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px">✕</button>';
    document.body.appendChild(notif);
    setTimeout(()=>notif?.remove(),8000);
  } catch(e){}
}

function bukaPdpaParent() {
  const m = document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:flex-end';
  let h = '<div style="background:#fff;border-radius:20px 20px 0 0;width:100%;padding:24px;max-height:85vh;overflow-y:auto;max-width:500px;margin:0 auto">';
  h += '<div style="font-size:16px;font-weight:700;color:#085041;margin-bottom:4px">🔒 Notis PDPA</div>';
  h += '<div style="font-size:11px;color:#888;margin-bottom:16px">Akta Perlindungan Data Peribadi 2010</div>';
  const pts = [
    ['Data yang dikumpul','Nama, No. KP, tarikh lahir, alamat, no. telefon, gambar, berat, tinggi dan rekod latihan anak anda.'],
    ['Tujuan penggunaan','Data digunakan HANYA untuk pengurusan keahlian gelanggang, rekod latihan, laporan bengkung dan komunikasi dengan waris.'],
    ['Keselamatan','Data disimpan dalam Google Drive peribadi jurulatih. Tiada perkongsian dengan pihak ketiga.'],
    ['Hak anda','Anda berhak mengakses, membetulkan atau meminta pemadaman data. Hubungi jurulatih untuk kemukakan permintaan.'],
    ['Kanak-kanak','Data kanak-kanak diuruskan dengan keizinan ibu bapa/penjaga yang bertanggungjawab.'],
  ];
  pts.forEach(([t,d])=>{
    h+='<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#085041;margin-bottom:3px">'+t+'</div>';
    h+='<div style="font-size:11px;color:#666;line-height:1.5">'+d+'</div></div>';
  });
  h += '<button onclick="this.parentElement.parentElement.remove()" style="width:100%;padding:12px;background:linear-gradient(135deg,#085041,#1D9E75);color:#fff;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;margin-top:8px">Faham & Tutup</button>';
  h += '</div>';
  m.innerHTML = h;
  document.body.appendChild(m);
}

function keluar() {
  dataAnak=null;dataKehadiran=[];dataYuran=[];kumpulanSilibus={};
  document.getElementById('portal-screen').style.display='none';
  document.getElementById('login-screen').style.display='block';
  document.getElementById('inp-kp').value='';
  document.querySelectorAll('.ptab').forEach((b,i)=>{b.classList.toggle('aktif',i===0);});
}
